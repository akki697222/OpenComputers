plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
    id 'scala'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge  {
    version = project.neoforge_version

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArgument '--nogui'
        }

        gameTestServer {
            type = "gameTestServer"

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/data/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.scala { srcDir 'src/data/scala' }
sourceSets.main.resources {
    srcDir 'src/data/resources'
    exclude '.cache/**'
}

configurations {
    embedded
    compileClasspath.extendsFrom embedded
    runtimeClasspath.extendsFrom embedded
    implementation.extendsFrom embedded
}

repositories {
    mavenCentral()
    maven {
        name "MightyPirates"
        url "https://maven.cil.li/"
        metadataSources {
            mavenPom()
            artifact()
        }
    }
    maven {
        url "https://maven.squiddev.cc"
        content {
            includeGroup "cc.tweaked"
        }
    }
    maven {
        url "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url "https://modmaven.dev"
        content {
            includeGroup "mezz.jei"
            includeGroup 'appeng'
        }
    }
    maven {
        url "https://chickenbones.net/maven/"
        content {
            includeGroup "codechicken"
            includeGroup "mrtjp"
        }
    }
    maven {
        url "https://modmaven.dev/"
        content {
            includeGroup "appeng"
            includeGroup "mekanism"
        }
    }
    maven {
        url "https://proxy-maven.covers1624.net/"
        content {
            includeModule "net.minecraftforge", "Scorge"
        }
    }
    maven {
        name = "Azure-SLP"
        url = uri("https://pkgs.dev.azure.com/Kotori316/minecraft/_packaging/mods/maven/v1")
        content {
            it.includeModule("com.kotori316", "ScalableCatsForce".toLowerCase())
            it.includeModule("org.typelevel", "cats-core_2.13")
            it.includeModule("org.typelevel", "cats-kernel_2.13")
        }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    flatDir { dirs 'libs' }
}

dependencies {
    compileOnly(group: 'org.scala-lang', name: 'scala-library', version: "2.13.12")
    compileOnly(group: 'org.typelevel', name: "cats-core_2.13", version: '2.8.1-kotori')
    runtimeOnly(group: "com.kotori316", name: "ScalableCatsForce".toLowerCase(), version: "3.3.1-build-0", classifier: "with-library") {
        transitive(false)
    }

    jarJar(implementation("com.typesafe:config:1.4.5"))
    jarJar(implementation(":OC-LuaJ-20220907.1"))
    jarJar(implementation(":OC-JNLua-Natives-20220928.1"))

    def jeiSlug = "jei-${minecraft_version}"

    compileOnly("curse.maven:jade-324717:${jade_version}")
    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-common-api:${cct_version}")
    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-core-api:${cct_version}")
    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cct_version}")
    runtimeOnly("cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cct_version}")
    runtimeOnly("maven.modrinth:modernfix:${modernfix_version}")
    
    // CoFH Core & Thermal
    compileOnly("curse.maven:cofh-core-69162:4801048")
    compileOnly("curse.maven:thermal-foundation-222880:4788649")

    compileOnly("org.appliedenergistics:appliedenergistics2:${ae2_version}:api")
    compileOnly("mekanism:Mekanism:${mekanism_version}:api")
    runtimeOnly("mezz.jei:${jeiSlug}-forge:${jei_version}")
    compileOnly("mezz.jei:${jeiSlug}-forge-api:${jei_version}")
    compileOnly("curse.maven:cb-multipart-258426:5292585")
    compileOnly("curse.maven:codechicken-lib-1-8-242818:5753868")
    compileOnly("curse.maven:ender-storage-1-8-245174:5292573")
    compileOnly("mrtjp:ProjectRed:${projred_version}:core")

    testImplementation("org.scala-lang:scala-library:2.13.12")
    testImplementation("org.scalatest:scalatest_3:3.2.18")
    testImplementation("org.scalatestplus:junit-4-13_3:3.2.18.0")
    testImplementation("junit:junit:4.13.2")
}

tasks.register('updateBuildNumber') {
    mustRunAfter 'clean'
    doLast {
        def buildFile = file('build.txt')
        if (!buildFile.exists()) buildFile.text = '0'
        def nextNum = buildFile.text.trim().toInteger() + 1
        buildFile.text = nextNum.toString()
    }
}

tasks.named('build') {
    dependsOn updateBuildNumber
}

gradle.taskGraph.whenReady { taskGraph ->
    def buildFile = file('build.txt')
    def buildNum = buildFile.exists() ? buildFile.text.trim() : "0"

    if (taskGraph.hasTask(':updateBuildNumber')) {
        project.version = "${mod_version}-${buildNum.toInteger() + 1}"
    } else {
        project.version = "${mod_version}-${buildNum}"
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version       : neoforge_version,
            neoforge_version_range : neoforge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/data/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named("createMinecraftArtifacts").configure {
    dependsOn(generateModMetadata)
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    from({
        configurations.embedded.collect { it.isDirectory() ? it : zipTree(it) }
    }) {
        exclude 'META-INF', 'META-INF/**'
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ScalaCompile).configureEach {
    scalaCompileOptions.forkOptions.memoryMaximumSize = '2g'
    scalaCompileOptions.forkOptions.jvmArgs = ['-Xss4m']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}